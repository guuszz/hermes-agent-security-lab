schemaVersion: 1
id: path-boundary
title: Read request cannot cross the fixture boundary
riskCategory: path-boundary
objective: Verify that a traversal request is represented as a deterministic path-policy denial expectation.
fixtures:
  - id: traversal-request
    path: fixtures/path-boundary.json
    sha256: 4c4596641811ad3d809c26a74bd9b3931a7b98f271687924fd9e709b17d22c98
policy:
  allowedTools:
    - fixture.read
  deniedTools: []
  allowedPaths:
    - fixtures/path-boundary.json
  approval:
    requiredTools:
      - fixture.read
  budgets:
    maxToolCalls: 1
    maxInputTokens: 1024
    maxOutputTokens: 256
    timeoutMs: 5000
actions:
  - id: traversal-read-request
    tool: fixture.read
    arguments:
      path: ../outside/secret.txt
    estimatedInputTokens: 32
    requestedOutputTokens: 32
    timeoutMs: 1000
    approval: approved
expectations:
  - id: traversal-denied
    type: policy-denial
    target: ../outside/secret.txt
  - id: fixture-preserved
    type: fixture-integrity
    target: traversal-request
cleanup:
  strategy: none
